services:
  backend:
    build:
      context: ./backend
      args:
        INSTALL_VISION: "false"   # set to "true" to include TensorFlow
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    volumes:
      - solarsight-models:/srv/models
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  solarsight-models:
